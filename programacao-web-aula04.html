<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 04 | Estrutura do HTML5 | Programação Web I</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root{--teal:#087e8b;--dark:#04545e;--soft:#e5f5f5;--orange:#e66b32;--ink:#14242b;--muted:#5d6c73;--line:#d8e3e5;--paper:#f4f8f8}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}h1,h2,h3{font-family:'Space Grotesk',sans-serif}.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line)}.topbar a{color:var(--dark);font-weight:700;text-decoration:none}.progress-track{height:5px;background:#d3e5e6}.progress-fill{height:100%;background:var(--orange);transition:width .25s}.slide-container{display:flex;align-items:center;min-height:calc(100vh - 67px);padding:1.5rem 1rem}.slide-card{width:min(1040px,100%);min-height:580px;margin:auto;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 12px 36px rgba(20,36,43,.08)}.slide-header,.slide-footer{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid var(--line)}.slide-footer{margin-top:auto;border-top:1px solid var(--line);border-bottom:0;background:#fbfdfd}.slide-badge{background:var(--soft);color:var(--dark);font-size:.76rem;font-weight:700;letter-spacing:.65px;padding:.35rem .65rem;text-transform:uppercase}.slide-body{flex:1;display:flex;align-items:center;padding:2rem}.slide-item{width:100%;animation:appear .22s ease}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.eyebrow{color:var(--teal);font-size:.76rem;font-weight:700;letter-spacing:1px;text-transform:uppercase}.slide-title{font-size:clamp(1.7rem,3vw,2.55rem);line-height:1.12}.slide-copy{max-width:820px;color:var(--muted);font-size:1.02rem;line-height:1.65}.topic-card{height:100%;padding:1.1rem;background:#fff;border:1px solid var(--line);border-radius:6px}.topic-card h3{font-size:1rem;color:var(--dark)}.topic-card p,.topic-card li{color:var(--muted);font-size:.92rem;line-height:1.6}.topic-card ul{padding-left:1.15rem;margin-bottom:0}.code{margin:0;padding:1rem;overflow:auto;background:#17292f;border-radius:6px;color:#e9f6f6;font:.86rem/1.65 Consolas,monospace;white-space:pre-wrap}.callout{padding:.8rem 1rem;color:var(--dark);background:var(--soft);border-left:4px solid var(--teal);font-size:.92rem}.question{background:#fff7ed;border-color:#fed7aa}.question h3{color:#9a3412}.dot{width:8px;height:8px;display:inline-block;border:0;border-radius:50%;background:#b8ced0;cursor:pointer}.dot.active{background:var(--orange);transform:scale(1.25)}.btn-teal{color:#fff;background:var(--teal);border-color:var(--teal)}.btn-teal:hover{color:#fff;background:var(--dark);border-color:var(--dark)}@media(max-width:575.98px){.slide-container{padding:.75rem}.slide-card{min-height:620px}.slide-header,.slide-footer{padding:.8rem}.slide-body{padding:1.25rem}.dots{display:none!important}.slide-copy{font-size:.94rem}.code{font-size:.75rem}}
    </style>
</head>
<body>
    <header class="topbar d-flex align-items-center px-3 px-md-4"><a href="programacao-web-1.html"><i class="bi bi-arrow-left-circle me-1"></i>Programação Web I</a><span class="ms-auto badge text-bg-light border" id="slideCount"></span></header>
    <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
    <main class="slide-container"><article class="slide-card"><div class="slide-header"><span class="slide-badge" id="slideCategory"></span><span class="small text-muted d-none d-sm-inline"><i class="bi bi-keyboard me-1"></i><kbd>&larr;</kbd> <kbd>&rarr;</kbd></span></div><div class="slide-body" id="slideBody"></div><div class="slide-footer"><button class="btn btn-outline-secondary btn-sm px-3" id="prevBtn"><i class="bi bi-chevron-left me-1"></i>Anterior</button><div class="dots d-flex gap-2" id="dots"></div><button class="btn btn-teal btn-sm px-3" id="nextBtn">Próximo<i class="bi bi-chevron-right ms-1"></i></button></div></article></main>
    <script>
        const slides = [
            ['Abertura','Aula 04: Estrutura do HTML5','Hoje vamos transformar uma página vazia em um documento HTML5 válido, organizado e pronto para receber conteúdo, estilo e interatividade.','Revisar internet, HTTP e ferramentas|Construir a anatomia de um arquivo HTML5|Organizar conteúdo com hierarquia e semântica'],
            ['Objetivos','Ao final da aula, você será capaz de','Criar uma página HTML5 com estrutura correta e explicar a função de cada área do documento.','Usar DOCTYPE, html, head e body|Configurar idioma, UTF-8, viewport e title|Aplicar títulos, textos, links e comentários|Reconhecer erros de estrutura e hierarquia'],
            ['Revisão','Da internet até a página','Antes de escrever HTML, relembre o caminho que uma página percorre até aparecer no navegador.','URL: endereço do recurso desejado|DNS: traduz domínio para endereço IP|HTTP: navegador solicita o recurso|Resposta: servidor devolve HTML, CSS e JavaScript'],
            ['Revisão','Cliente, servidor e navegador','O navegador é o cliente que solicita recursos; o servidor armazena ou gera a resposta.','Cliente: Chrome, Firefox ou Edge interpreta a página|Servidor: recebe a requisição e envia uma resposta|HTML: documento que o navegador reconhece e exibe'],
            ['Revisão','HTTP em uma conversa curta','Cada acesso a uma página inicia uma troca de mensagens entre cliente e servidor.','GET solicita a leitura de um recurso|200 OK informa que a solicitação funcionou|Content-Type text/html identifica o formato da resposta'],
            ['Revisão','Ferramentas da disciplina','O ambiente de desenvolvimento ajuda a escrever, organizar, testar e corrigir o código.','VS Code para editar arquivos|Explorador para manter a pasta do projeto organizada|DevTools com F12 para inspecionar elementos e erros'],
            ['Fundamento','O que é HTML?','HTML significa HyperText Markup Language. É uma linguagem de marcação: elementos descrevem o significado e a estrutura do conteúdo.','HTML: estrutura e conteúdo|CSS: aparência, layout e cores|JavaScript: comportamento e interatividade'],
            ['Estrutura','A anatomia de um documento HTML5','Toda página deve começar com uma estrutura mínima, mesmo que ainda não tenha conteúdo visível.','DOCTYPE declara o padrão HTML5|html é o elemento raiz|head contém metadados|body contém o conteúdo apresentado'],
            ['DOCTYPE','A declaração inicial','DOCTYPE não é uma tag HTML. Ela fica na primeira linha e informa ao navegador que o documento usa o padrão HTML5.','Use: <!doctype html>|Evita modos antigos de compatibilidade|Deve ser a primeira linha do arquivo'],
            ['HTML','O elemento raiz','Quase todo o documento está dentro de html. O atributo lang declara o idioma principal da página.','Use: <html lang="pt-BR">|Ajuda leitores de tela e tradução|Favorece mecanismos de busca'],
            ['HEAD','Informações sobre a página','O conteúdo do head não aparece como parte principal da tela. Ele reúne configurações e referências necessárias ao navegador.','meta: dados técnicos|title: texto da aba|link: conexão com arquivos CSS'],
            ['HEAD','Codificação UTF-8','A meta charset permite que o navegador apresente corretamente acentos e outros caracteres.','Use: <meta charset="UTF-8">|Evita símbolos estranhos em palavras acentuadas|Fica dentro de head'],
            ['HEAD','Viewport para dispositivos móveis','A meta viewport prepara a página para usar a largura do dispositivo como referência.','Use width=device-width|Use initial-scale=1.0|É a base para páginas responsivas'],
            ['HEAD','Título da aba','O elemento title descreve a página na aba do navegador, no histórico e em favoritos.','title fica dentro de head|h1 fica dentro de body|Ambos podem ter textos parecidos, mas funções diferentes'],
            ['BODY','Conteúdo visível','Dentro de body ficam os textos, imagens, links, listas, formulários e regiões que a pessoa usuária acessa.','h1 define o título principal|p representa um parágrafo|O navegador apresenta os elementos do body'],
            ['Conceitos','Tags, elementos e atributos','Dominar esses três termos ajuda a entender qualquer trecho de HTML.','Tag: marca como <p>|Elemento: abertura, conteúdo e fechamento|Atributo: característica como href, src ou lang'],
            ['Atributos','Informações adicionais','Atributos aparecem na tag de abertura e acrescentam dados úteis ao elemento.','href indica destino de link|src indica origem de arquivo|Escreva valores entre aspas'],
            ['Texto','Hierarquia de títulos','Títulos organizam o conteúdo e devem refletir sua importância, não apenas o tamanho visual.','h1 é o tema principal|h2 divide os assuntos principais|h3 detalha uma subseção de h2'],
            ['Texto','Parágrafos e ênfase','Use p para parágrafos. strong indica importância e em indica ênfase no significado da frase.','p para blocos de texto|strong não serve apenas para negrito|em não serve apenas para itálico'],
            ['Texto','Bloco, linha e espaço','Alguns elementos criam áreas próprias; outros aparecem dentro de uma mesma linha de texto.','Bloco: h1, p e div|Em linha: strong, em e a|Não use br para construir layout'],
            ['Navegação','Links conectam documentos','O elemento a cria links para páginas externas ou para arquivos do próprio projeto.','href absoluto: https://exemplo.com|href relativo: contato.html|O texto do link deve descrever seu destino'],
            ['Mídia','Imagens com significado','Uma imagem informativa precisa de texto alternativo que comunique sua informação essencial.','src indica o arquivo de imagem|alt descreve conteúdo relevante|Imagem decorativa usa alt vazio'],
            ['Organização','Listas para conteúdo relacionado','Listas agrupam itens que pertencem ao mesmo conjunto, evitando linhas soltas ou separadas por quebras manuais.','ul para itens sem ordem|ol para etapas em sequência|li representa cada item da lista'],
            ['Semântica','Por que escolher a tag certa?','Semântica é selecionar o elemento pelo significado do conteúdo, beneficiando acessibilidade, manutenção e busca.','Leitores de tela entendem melhor a página|Código comunica sua intenção|Buscadores reconhecem a estrutura'],
            ['Semântica','Regiões da página','HTML5 fornece elementos para dividir a página em áreas com papéis claros.','header abre uma área de página|nav reúne navegação|main contém o assunto central|footer encerra informações complementares'],
            ['Qualidade','Comentários com propósito','Comentários registram decisões e ajudam na leitura do código, mas não são mostrados para a pessoa usuária.','Use: <!-- comentário -->|Explique decisões não óbvias|Não esconda código antigo em comentários'],
            ['Qualidade','Aninhamento correto','Elementos precisam ser fechados na ordem inversa em que foram abertos, como caixas encaixadas.','Correto: <p>Aprendo <strong>HTML</strong>.</p>|Evite fechar p antes de strong|Indentação ajuda a visualizar a estrutura'],
            ['Prática','Crie seu index.html','Na pasta do projeto, crie index.html com a base HTML5 e acrescente seu primeiro conteúdo.','DOCTYPE na primeira linha|html com lang="pt-BR"|head com charset, viewport e title|body com h1 e parágrafo'],
            ['Desafio','Perfil profissional em HTML5','Construa uma página de perfil usando o que aprendeu. Salve, abra no navegador e revise a estrutura.','Inclua um h1 com seu nome|Crie duas seções com h2|Liste três habilidades com ul e li|Adicione um link para uma fonte de estudo'],
            ['Síntese','O que consolidamos hoje','Você já tem a base para produzir documentos HTML5 claros e corretos.','Estrutura: DOCTYPE, html, head e body|Conteúdo: títulos, parágrafos, links, imagens e listas|Qualidade: idioma, metadados, semântica e aninhamento'],
            ['Próxima aula','Aula 05: HTML semântico e conteúdo','No próximo encontro, vamos aprofundar regiões semânticas, hierarquia de conteúdo, links e imagens para criar páginas mais completas.','Pratique: leia seu HTML e pergunte se cada tag descreve o conteúdo|Revise: title, h1 e alt têm funções diferentes|Retorne ao plano de aulas ao concluir']
        ];
        const body=document.getElementById('slideBody'),count=document.getElementById('slideCount'),category=document.getElementById('slideCategory'),progress=document.getElementById('progressBar'),dots=document.getElementById('dots'),previous=document.getElementById('prevBtn'),next=document.getElementById('nextBtn');let current=0;
        const codeBySlide={7:'<!doctype html>\n<html lang="pt-BR">\n  <head>...</head>\n  <body>...</body>\n</html>',11:'<meta charset="UTF-8">',12:'<meta name="viewport" content="width=device-width, initial-scale=1.0">',13:'<title>Meu perfil</title>\n<h1>Meu perfil</h1>',14:'<body>\n  <h1>Meu perfil profissional</h1>\n  <p>Estudante de Programação Web I.</p>\n</body>',16:'<a href="https://developer.mozilla.org/">\n  Consultar documentação\n</a>',18:'<h1>Meu perfil</h1>\n  <h2>Sobre mim</h2>\n  <h2>Projetos</h2>',20:'<img src="imagens/perfil.jpg"\n     alt="Pessoa sorrindo em frente a um notebook">',21:'<ul>\n  <li>HTML</li>\n  <li>CSS</li>\n</ul>',25:'<!-- Seção principal do perfil -->\n<main>...</main>',26:'<p>Aprendo <strong>HTML</strong>.</p>',28:'<!doctype html>\n<html lang="pt-BR">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>Meu perfil profissional</title>\n</head>\n<body>...</body>\n</html>'};
        slides.forEach((_,index)=>{const dot=document.createElement('button');dot.className='dot p-0';dot.type='button';dot.title=`Ir para o slide ${index+1}`;dot.addEventListener('click',()=>show(index));dots.appendChild(dot)});
        function escapeHtml(text){return text.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
        function show(index){current=index;const[label,title,description,items]=slides[current];const cards=items.split('|').map(item=>`<li>${item}</li>`).join('');const code=codeBySlide[current]?`<pre class="code mt-3">${escapeHtml(codeBySlide[current])}</pre>`:'';body.innerHTML=`<section class="slide-item"><div class="eyebrow">Programação Web I | ${label}</div><h1 class="slide-title mt-2">${title}</h1><p class="slide-copy">${description}</p>${code}<div class="topic-card mt-3 ${current===29?'question':''}"><h3>${current===29?'Para praticar':'Pontos principais'}</h3><ul>${cards}</ul></div></section>`;category.textContent=`Aula 04 | ${label}`;count.textContent=`Slide ${current+1} de ${slides.length}`;progress.style.width=`${(current+1)/slides.length*100}%`;[...dots.children].forEach((dot,dotIndex)=>dot.classList.toggle('active',dotIndex===current));previous.disabled=current===0;next.innerHTML=current===slides.length-1?'Concluir<i class="bi bi-check2 ms-1"></i>':'Próximo<i class="bi bi-chevron-right ms-1"></i>'}
        previous.addEventListener('click',()=>{if(current>0)show(current-1)});next.addEventListener('click',()=>{if(current<slides.length-1)show(current+1);else window.location.href='programacao-web-1.html'});document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'&&current>0)show(current-1);if(event.key==='ArrowRight')next.click()});show(0);
    </script>
</body>
</html>
